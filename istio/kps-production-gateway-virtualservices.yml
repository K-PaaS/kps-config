apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: httpbin-gateway-user-kps
  namespace: kps
spec:
  selector:
    istio: ingressgateway
  servers:
    - hosts:
        - k-paas.or.kr
        - www.k-paas.or.kr
      port:
        name: http
        number: 80
        protocol: HTTP

    - hosts:
        - k-paas.or.kr
        - www.k-paas.or.kr
      port:
        name: https-kpaas
        number: 443
        protocol: HTTPS
      tls:
        credentialName: cert-kpaas-or-kr2
        mode: SIMPLE
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: kps-web-user-en-vs
  namespace: kps
spec:
  gateways:
    - httpbin-gateway-user-kps
  hosts:
    - k-paas.or.kr
  http:
    - match:
        - uri:
            prefix: /eng
      route:
        - destination:
            host: kps-web-user-en.kps.svc.cluster.local
            port:
              number: 8070
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: kps-web-user-vs
  namespace: kps
spec:
  gateways:
    - httpbin-gateway-user-kps
  hosts:
    - k-paas.or.kr
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: kps-web-user.kps.svc.cluster.local
            port:
              number: 8080
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: kps-web-user-vs-www
  namespace: kps
spec:
  gateways:
    - httpbin-gateway-user-kps
  hosts:
    - www.k-paas.or.kr
  http:
    - match:
        - uri:
            prefix: /
      redirect:
        authority: k-paas.or.kr
        uri: /
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: kps-admin-gateway
  namespace: kps
spec:
  selector:
    istio: ingressgateway
  servers:
    - hosts:
        - "*.k-paas.org"
      port:
        name: http
        number: 80
        protocol: HTTP
    - hosts:
        - "*.k-paas.org"
      port:
        name: https
        number: 443
        protocol: HTTPS
      tls:
        credentialName: cert-k-paas-org
        mode: SIMPLE
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: kps-admin-vs
  namespace: kps
spec:
  gateways:
    - kps-admin-gateway
  hosts:
    - admin.k-paas.org
  http:
    - match:
        - uri:
            prefix: /kpsadmin
      route:
        - destination:
            host: kps-web-admin.kps.svc.cluster.local
            port:
              number: 8090
---
