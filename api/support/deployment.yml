#
#
# kps-api-support deployment.yaml
#
# 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kps-api-support
  namespace: kps
  labels:
    app: kps-api-support
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kps-api-support
  template:
    metadata:
      labels:
        app: kps-api-support
    spec:
      containers:
      - name: kps-api-support
        image: 56816249-kr1-registry.container.nhncloud.com/kpaas-container-registry/kps-api-support:2.0.0
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 300m
            memory: 800Mi
          limits:
            cpu: 800m
            memory: 2500Mi                
        ports:
        - containerPort: 9080
        volumeMounts:
        - mountPath: /var/vcap/data
          name: backup-storage
      volumes:
      - name: backup-storage
        persistentVolumeClaim:
          claimName: backup-pv-claim
      imagePullSecrets:
        - name: ncp-container
