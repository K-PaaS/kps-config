apiVersion: v1
kind: PersistentVolume
metadata:
  name: backup-pv-volume
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: backup-hostpath
  volumeMode: Filesystem
  hostPath:
    path: /data/logs
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-pv-claim
  namespace: kps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: backup-hostpath
  volumeMode: Filesystem
  volumeName: backup-pv-volume
  resources:
    requests:
      storage: 10Gi
